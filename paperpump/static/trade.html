<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>PaperPump · Trade</title>
<link rel="stylesheet" href="/static/app.css"></head><body>
<main class="wrap nocoin" id="main">
  <div class="full sbox">
    <form class="search" id="searchForm" role="search">
      <input id="mint" type="search" placeholder="Search coin name, ticker or contract address" autocomplete="off"
             autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search coins" aria-controls="results">
      <button class="btn primary">Go</button>
    </form>
    <div class="card results" id="results" role="listbox" hidden></div>
  </div>

  <div class="full dwrap" id="feed"></div>

  <div class="full backbar"><button class="btn sm" id="backFeed" type="button">← Back to feed</button></div>
  <div class="card pad full th" id="header"><span class="mu">Paste a contract address above to load a coin.</span></div>

  <div class="card chart" id="chart"><div class="empty">The live chart will appear here.</div></div>

  <div class="card pad" id="panel" style="grid-row:span 2">
    <div class="tabs"><button id="tabBuy" class="on buy">Buy</button><button id="tabSell" class="sell">Sell</button></div>
    <div id="buyBox">
      <label>Amount (SOL)</label><input id="amount" type="number" step="0.01" min="0" value="0.5">
      <div class="q"></div>
    </div>
    <div id="sellBox" style="display:none">
      <label>Sell percent of position</label>
      <div class="q" id="pctBtns"></div>
    </div>
    <div class="est" id="summary"><div class="mu">Load a coin to start.</div></div>
    <div class="mu" id="hint" style="margin-top:8px;min-height:18px"></div>
    <button class="btn green" id="go" style="width:100%;margin-top:12px;padding:12px" disabled>Paper Buy</button>
    <label style="margin-top:16px">Auto-sell for this coin (after buying)</label>
    <div class="row"><span>Take profit</span><span id="tpBtns"></span></div>
    <div class="row"><span>Stop loss</span><span id="slBtns"></span></div>
  </div>

  <div class="card full">
    <div class="pad" style="display:flex;justify-content:space-between"><h2>Open positions</h2></div>
    <div class="scroll"><table id="pos"></table></div>
  </div>
</main>
<script src="/static/app.js"></script>
<script src="/static/discover.js"></script>
<script>
nav("Trade");
const feedPoller = mountDiscover($("#feed"), (mint) => { $("#mint").value = ""; loadToken(mint); window.scrollTo(0, 0); });
function showFeed(on) {
  $("#main").classList.toggle("nocoin", on);
  $("#feed").hidden = !on;
  if (on) feedPoller.tick();
}
$("#backFeed").onclick = () => { token = null; history.replaceState(null, "", "/"); showFeed(true); window.scrollTo(0, 0); };
let token = null, side = "buy", pct = 100, positions = [];

// quick amount buttons
$("#buyBox .q").innerHTML = ["0.1", "0.25", "0.5", "1"].map((a) => `<button class="btn sm" data-a="${a}">${a}</button>`).join("");
$("#buyBox .q").onclick = (e) => { if (e.target.dataset.a) { $("#amount").value = e.target.dataset.a; preview(); } };
$("#pctBtns").innerHTML = [25, 50, 100].map((p) => `<button class="btn sm ${p === 100 ? "on" : ""}" data-p="${p}">${p}%</button>`).join("");
$("#pctBtns").onclick = (e) => {
  if (!e.target.dataset.p) return;
  pct = +e.target.dataset.p;
  document.querySelectorAll("#pctBtns button").forEach((b) => b.classList.toggle("on", +b.dataset.p === pct));
  preview();
};
$("#amount").oninput = () => { clearTimeout(window._pv); window._pv = setTimeout(preview, 300); };
$("#tabBuy").onclick = () => setSide("buy");
$("#tabSell").onclick = () => setSide("sell");
$("#tpBtns").innerHTML = [25, 50, 100].map((p) => `<button class="btn sm" data-k="tp" data-v="${p}">+${p}%</button>`).join(" ");
$("#slBtns").innerHTML = [10, 20, 30].map((p) => `<button class="btn sm" data-k="sl" data-v="${p}">-${p}%</button>`).join(" ");
$("#panel").addEventListener("click", async (e) => {
  const k = e.target.dataset.k; if (!k) return;
  const p = token && positions.find((x) => x.mint === token.mint);
  if (!p) return toast("Buy this coin first, then set take profit / stop loss.");
  try { await api("/api/tpsl", { position_id: p.id, [k]: +e.target.dataset.v }); toast(`${k.toUpperCase()} set at ${k === "tp" ? "+" : "-"}${e.target.dataset.v}%`); afterAction(); }
  catch (err) { toast("❌ " + esc(err.message)); }
});

function setSide(s) {
  side = s;
  $("#tabBuy").className = s === "buy" ? "on buy" : "buy";
  $("#tabSell").className = s === "sell" ? "on sell" : "sell";
  $("#buyBox").style.display = s === "buy" ? "" : "none";
  $("#sellBox").style.display = s === "sell" ? "" : "none";
  $("#go").className = "btn " + (s === "buy" ? "green" : "red");
  preview();
}

// ---------- coin search (debounced; server shares DexScreener cache + rate budget) ----------
const isMint = (s) => /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(s);
let searchSeq = 0, lastResults = [];
function hideResults() { $("#results").hidden = true; }
function showResults(html) { $("#results").innerHTML = html; $("#results").hidden = false; }
async function runSearch(q) {
  const seq = ++searchSeq;
  showResults(`<div class="ri mu">Searching…</div>`);
  try {
    const res = await api("/api/search?q=" + encodeURIComponent(q));
    if (seq !== searchSeq) return;  // a newer query is on its way
    lastResults = res;
    showResults(res.length ? res.map((r) => `
      <button type="button" class="ri" role="option" data-mint="${esc(r.mint)}">
        <span class="rn"><b>${esc(r.name)}</b> <span class="mu">$${esc(r.symbol)}</span></span>
        <span class="rs"><span><i>MC</i>${usd(r.market_cap)}</span><span><i>Liq</i>${usd(r.liquidity_usd)}</span><span><i>Vol</i>${usd(r.volume_24h)}</span></span>
      </button>`).join("") : `<div class="ri mu">No Solana coins found.</div>`);
  } catch (e) { if (seq === searchSeq) showResults(`<div class="ri r">${esc(e.message)}</div>`); }
}
$("#mint").oninput = () => {
  clearTimeout(window._sq);
  const q = $("#mint").value.trim();
  if (q.length < 2) { searchSeq++; lastResults = []; return hideResults(); }
  window._sq = setTimeout(() => runSearch(q), 400);
};
$("#mint").onfocus = () => { if (lastResults.length) $("#results").hidden = false; };
$("#results").onclick = (e) => {
  const b = e.target.closest("[data-mint]"); if (!b) return;
  hideResults(); $("#mint").blur(); loadToken(b.dataset.mint);
};
document.addEventListener("click", (e) => { if (!e.target.closest(".sbox")) hideResults(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideResults(); });
$("#searchForm").onsubmit = (e) => {
  e.preventDefault();
  clearTimeout(window._sq);
  const q = $("#mint").value.trim();
  if (isMint(q)) { hideResults(); return loadToken(q); }
  if (q.length >= 2) runSearch(q);
};

async function loadToken(mint) {
  if (!mint) return;
  showFeed(false);
  history.replaceState(null, "", "/?mint=" + encodeURIComponent(mint));
  $("#header").innerHTML = `<span class="mu">Loading…</span>`;
  try { token = await api("/api/token/" + encodeURIComponent(mint)); }
  catch (e) { token = null; $("#header").innerHTML = `<span class="r">${esc(e.message)}</span>`; return; }
  const t = token;
  // Built once; the numbers are then updated in place by applyPrices() every ~1.2s.
  $("#header").innerHTML = `
    <div class="name"><b>${esc(t.name)}</b> <span class="mu">$${esc(t.symbol)}</span><div class="mu">${esc(t.mint.slice(0, 6))}…${esc(t.mint.slice(-6))} · ${esc(t.dex)}</div></div>
    <div class="stat"><span class="mu">Price</span><b id="hPrice"></b></div>
    <div class="stat"><span class="mu">Market cap</span><b id="hMc"></b></div>
    <div class="stat"><span class="mu">Liquidity</span><b id="hLiq"></b></div>
    <div class="stat"><span class="mu">Vol 24h</span><b id="hVol"></b></div>
    <div class="stat"><span class="mu">Holders</span><b>${t.holders ?? "n/a"}</b></div>
    <div class="stat"><span class="mu">Age</span><b id="hAge"></b></div>
    <a class="mu" href="${esc(t.url)}" target="_blank" rel="noopener">DexScreener ↗</a>`;
  renderHeader();
  // LIVE chart: DexScreener's official embed for this pair
  $("#chart").innerHTML = t.pair_address
    ? `<iframe title="Live chart" src="https://dexscreener.com/solana/${encodeURIComponent(t.pair_address)}?embed=1&theme=dark&trades=0&info=0"></iframe>`
    : `<div class="empty">No chart available for this coin.</div>`;
  $("#go").disabled = false;
  renderSummary(); preview(); liveNow();
}

function renderHeader() {
  const t = token;
  setText($("#hPrice"), "$" + t.price_usd.toPrecision(4));
  setText($("#hMc"), usd(t.market_cap));
  setText($("#hLiq"), usd(t.liquidity_usd));
  setText($("#hVol"), usd(t.volume_24h));
  setText($("#hAge"), t.age);
}

// One small muted line: what you'd roughly get (fees included).
async function preview() {
  if (!token) return;
  const amount = side === "buy" ? +$("#amount").value : pct;
  setText($("#go"), side === "buy" ? `Paper Buy ${amount || 0} SOL` : `Paper Sell ${pct}%`);
  if (!amount) return setText($("#hint"), "");
  if (side === "sell" && !myPosition()) return setText($("#hint"), "You don't hold this coin.");
  try {
    const q = await api(`/api/quote?mint=${encodeURIComponent(token.mint)}&side=${side}&amount=${amount}`);
    setText($("#hint"), side === "buy"
      ? `You'll get ~${Math.round(q.tokens).toLocaleString()} $${token.symbol}`
      : `~${q.sol.toFixed(3)} SOL back`);
  } catch (e) { setText($("#hint"), e.message); }
}

const myPosition = () => token && positions.find((x) => x.mint === token.mint);

// Compact summary of your position in the loaded coin (same on Buy and Sell tabs).
// Structure comes from the ~5s position poll; Holding/PnL numbers are filled by applyPrices() every ~1.2s.
function renderSummary() {
  if (!token) return;
  const p = myPosition();
  if (!p) return setHTML($("#summary"), `<div class="mu">No position yet</div>`);
  setHTML($("#summary"), `
    <div class="row">Bought<b id="sBought"></b></div>
    <div class="row">Holding<b id="sHold"></b></div>
    <div class="row">Sold<b id="sSold"></b></div>
    <div class="row">PnL<b id="sPnl"></b></div>`);
  applyPrices();
}

// ---------- fast price tick (~1.2s) ----------
// Holding value and PnL are computed here in the browser from the newest price,
// so they move in the same tick as the market cap.
const prices = {};  // mint -> latest quote
function valueOf(p) {
  const q = prices[p.mint];
  return q ? p.tokens * q.price_sol : p.value_sol;  // fall back to the 5s server value
}
function setPnl(el, pnl, pct) {
  if (!el) return;
  setText(el, pnl === null || pnl === undefined || isNaN(pnl) ? "n/a" : `${signed(pnl)} SOL (${signed(pct, 1)}%)`);
  const c = pnl >= 0 ? "g" : "r";
  if (!el.classList.contains(c)) { el.classList.remove("g", "r"); el.classList.add(c); }
}
function applyPrices() {
  if (token && prices[token.mint]) Object.assign(token, prices[token.mint]), renderHeader();
  const p = myPosition();
  if (p && $("#sHold")) {
    const v = valueOf(p);
    setText($("#sBought"), `${p.bought_sol.toFixed(3)} SOL`);
    setText($("#sSold"), `${p.sold_sol.toFixed(3)} SOL`);
    setText($("#sHold"), `${Math.round(p.tokens).toLocaleString()} $${p.symbol} · ${sol(v)} SOL`);
    const total = v + p.sold_sol - p.bought_sol;
    setPnl($("#sPnl"), total, p.bought_sol ? total / p.bought_sol * 100 : 0);
  }
  for (const r of positions) {
    const v = valueOf(r), q = prices[r.mint];
    setText($("#v-" + r.id), `${sol(v)} SOL`);
    setPnl($("#p-" + r.id), v - r.cost_sol, r.cost_sol ? (v - r.cost_sol) / r.cost_sol * 100 : 0);
    setText($("#m-" + r.id), q ? usd(q.market_cap) : r.market ? usd(r.market.market_cap) : "–");
  }
}
let tickN = 0;
async function priceTick() {
  const mints = [...new Set([token && token.mint, ...positions.map((p) => p.mint)].filter(Boolean))];
  if (!mints.length) return;
  const got = await api("/api/quotes?mints=" + mints.join(","));
  for (const [m, q] of Object.entries(got)) if (q) prices[m] = q;
  applyPrices();
  if (++tickN % 3 === 0) preview();  // the "You'll get ~…" line every ~3.6s is plenty
}

$("#go").onclick = async () => {
  if (!token) return;
  $("#go").disabled = true;
  try {
    if (side === "buy") {
      const r = await api("/api/buy", { mint: token.mint, sol: +$("#amount").value });
      toast(`🟢 Bought ${Math.round(r.tokens).toLocaleString()} $${esc(r.symbol)} for ${r.sol} SOL · impact ${r.impact_pct.toFixed(2)}%`);
    } else {
      const p = positions.find((x) => x.mint === token.mint);
      if (!p) throw new Error("You don't hold this coin.");
      const r = await api("/api/sell", { position_id: p.id, percent: pct });
      toast(`${r.pnl_sol >= 0 ? "🟢" : "🔴"} Sold ${r.percent}% of $${esc(r.symbol)}<br>Put in ${r.put_in.toFixed(2)} SOL · Got back ${r.got_back.toFixed(2)} SOL<br>PnL ${signed(r.pnl_sol, 2)} SOL (${signed(r.pnl_pct, 1)}%)`, 6000);
    }
    afterAction();
  } catch (e) { toast("❌ " + esc(e.message)); }
  $("#go").disabled = false;
};

// Positions table + summary: redrawn from the shared live portfolio poll (~5s), only when something changed.
document.addEventListener("portfolio", (e) => {
  positions = e.detail.positions;
  setHTML($("#pos"), `<tr><th>Coin</th><th>Cost</th><th>Value</th><th>PnL</th><th>MC</th><th>TP / SL</th><th></th></tr>` +
    (positions.map((p) => `<tr>
      <td><a href="/?mint=${encodeURIComponent(p.mint)}">$${esc(p.symbol)}</a></td><td>${sol(p.cost_sol)} SOL</td>
      <td id="v-${p.id}"></td><td id="p-${p.id}"></td><td id="m-${p.id}"></td>
      <td>${p.tp_pct ? "+" + p.tp_pct + "%" : "off"} / ${p.sl_pct ? "-" + p.sl_pct + "%" : "off"}</td>
      <td>${[25, 50, 100].map((x) => `<button class="btn sm" onclick="quickSell(${p.id},${x})">Sell ${x}%</button>`).join(" ")}</td></tr>`).join("")
     || `<tr><td class="mu" colspan="7">No open positions yet.</td></tr>`));
  renderSummary();
  applyPrices();
});

async function quickSell(id, p) {
  try {
    const r = await api("/api/sell", { position_id: id, percent: p });
    toast(`${r.pnl_sol >= 0 ? "🟢" : "🔴"} Sold ${r.percent}% of $${esc(r.symbol)} · PnL ${signed(r.pnl_sol, 2)} SOL (${signed(r.pnl_pct, 1)}%)`, 6000);
    afterAction();
  } catch (e) { toast("❌ " + esc(e.message)); }
}

live(priceTick, 1200);  // prices ~1.2s; positions/balance come from the ~5s poll in app.js
const m = new URLSearchParams(location.search).get("mint");
if (m) { $("#mint").value = m; loadToken(m); }
</script></body></html>
