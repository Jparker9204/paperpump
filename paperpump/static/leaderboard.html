<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>PaperPump · Leaderboard</title>
<link rel="stylesheet" href="/static/app.css"></head><body>
<main class="wrap"><div class="card full"><div class="pad"><h2>🏆 Leaderboard</h2><p class="mu">Profit from closed trades since each trader's last reset.</p></div>
<div class="scroll"><table id="t"></table></div></div></main>
<script src="/static/app.js"></script>
<script>
nav("Leaderboard");
api("/api/leaderboard").then((rows) => {
  const medal = ["🥇", "🥈", "🥉"];
  $("#t").innerHTML = `<tr><th>#</th><th>Trader</th><th>PnL</th><th>Win rate</th><th>Trades</th><th>Resets</th></tr>` +
    (rows.map((r, i) => `<tr style="${r.me ? "background:#0f1d33" : ""}"><td>${medal[i] || i + 1}</td><td>${esc(r.username || "anon")}${r.me ? " (you)" : ""}</td>
      <td class="${cls(r.pnl)}">${signed(r.pnl, 2)} SOL</td><td>${r.trades ? Math.round(r.wins / r.trades * 100) + "%" : "–"}</td>
      <td>${r.trades}</td><td>${r.resets}</td></tr>`).join("") || `<tr><td class="mu" colspan="6">Empty</td></tr>`);
}).catch(() => {});
</script></body></html>
